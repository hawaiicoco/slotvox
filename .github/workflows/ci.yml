name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }} on ubuntu-latest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with dev + torch extras (CPU wheels)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev,torch]" \
            --extra-index-url https://download.pytorch.org/whl/cpu
      - name: make build
        run: make build
      - name: make test-all
        run: make test-all
      - name: make format-check
        run: make format-check
      - name: make lint
        run: make lint
      - name: make typecheck
        run: make typecheck
      - name: Wheel install smoke test
        run: python scripts/check_package.py

  core-only:
    name: NumPy-only core on Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install without the torch extra
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Verify torch is absent
        run: .venv/bin/python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
