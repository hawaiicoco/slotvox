[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "slotvox"
description = "End-to-end spoken language understanding toolkit for fully synthetic speech experiments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Zheng Haodi", email = "237059476+hawaiicoco@users.noreply.github.com" },
]
keywords = [
    "speech",
    "spoken-language-understanding",
    "intent-classification",
    "slot-filling",
    "synthetic-data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26"]
dynamic = ["version"]

[project.optional-dependencies]
torch = ["torch>=2.2"]
dev = ["pytest>=8.0", "ruff>=0.6", "build>=1.2", "mypy>=1.11", "hatchling>=1.26"]

[project.scripts]
slotvox = "slotvox.cli:main"

[project.urls]
Homepage = "https://github.com/hawaiicoco/slotvox"
Issues = "https://github.com/hawaiicoco/slotvox/issues"
Changelog = "https://github.com/hawaiicoco/slotvox/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/slotvox/_version.py"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["slotvox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running training or integration tests (excluded from `make test`)",
    "model: requires the optional torch extra; skipped cleanly when torch is absent",
]

[tool.mypy]
files = ["src/slotvox"]
ignore_missing_imports = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
